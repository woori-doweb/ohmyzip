# ohmyzip/ 를 바꾼 커밋이 main 에 올라오면 빌드·시험 → ohmyzip/packaging/package.py 로 배포 zip·sha256 생성 → 직전 v* 태그 이후 ohmyzip/ 커밋 이력을 노트로 GitHub Release v<버전> 을 만들고 latest 로 표시한다(ohmyZip 자동 업데이트가 releases/latest 를 읽는다).
# 파일 이름 release.yml 은 바꾸지 않는다: run_number 가 버전 patch 이고, 이름을 바꾸면 1 부터 다시 센다.
name: ohmyzip release

on:
  push:
    branches: [main]
    paths:
      - "ohmyzip/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-ohmyzip
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: ohmyzip
    env:
      PYTHONIOENCODING: utf-8
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute version
        id: version
        run: |
          $m = Select-String -Path src/OhMyZip.App/OhMyZip.App.csproj -Pattern '<Version>(\d+)\.(\d+)\.\d+</Version>' | Select-Object -First 1
          if (-not $m) { throw "src/OhMyZip.App/OhMyZip.App.csproj 에서 <Version>major.minor.patch</Version> 를 찾지 못했습니다." }
          $ver = "$($m.Matches[0].Groups[1].Value).$($m.Matches[0].Groups[2].Value).${{ github.run_number }}"
          $tag = "v$ver"
          git rev-parse -q --verify "refs/tags/$tag" | Out-Null
          $exists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          if ($exists) { Write-Host "태그 $tag 가 이미 있어 릴리스를 건너뜁니다." }
          "version=$ver" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "skip=$($exists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "version=$ver tag=$tag skip=$exists"

      - name: Setup .NET
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Setup Python
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Build
        if: steps.version.outputs.skip != 'true'
        run: dotnet build OhMyZip.sln -c Release

      - name: Test
        if: steps.version.outputs.skip != 'true'
        # 나머지 시험은 저장소 밖 fixtures 가 필요해 여기서는 돌리지 않는다.
        run: dotnet test tests/OhMyZip.Core.Tests -c Release --no-build --filter "FullyQualifiedName~DesignTokenTests|FullyQualifiedName~AppUpdaterTests|FullyQualifiedName~LocalizationTests"

      - name: Package
        if: steps.version.outputs.skip != 'true'
        run: python -X utf8 packaging/package.py "${{ steps.version.outputs.version }}"

      - name: Release notes
        if: steps.version.outputs.skip != 'true'
        run: |
          $prev = git tag --list "v*" --merged HEAD --sort=-v:refname | Select-Object -First 1
          if ($prev) {
            Write-Host "직전 태그: $prev"
            git log --no-merges --pretty=format:"- %s (%h)" --output=notes.md "$prev..HEAD" -- .
          } else {
            Write-Host "직전 태그 없음: 전체 이력"
            git log --no-merges --pretty=format:"- %s (%h)" --output=notes.md HEAD -- .
          }
          if ($LASTEXITCODE -ne 0) { throw "git log 실패 (rc=$LASTEXITCODE)" }
          if ((Get-Item notes.md).Length -eq 0) {
            Set-Content -Path notes.md -Value "- 직전 릴리스 이후 새 커밋이 없습니다." -Encoding utf8NoBOM
          }
          Get-Content notes.md -Encoding utf8

      - name: Create release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view $env:TAG | Out-Null
          if ($LASTEXITCODE -eq 0) {
            $global:LASTEXITCODE = 0
            Write-Host "릴리스 $env:TAG 가 이미 있어 건너뜁니다."
            exit 0
          }
          $global:LASTEXITCODE = 0
          $zip = "releases/ohmyZip-$env:VER-win-x64.zip"
          gh release create $env:TAG $zip "$zip.sha256" --title "ohmyZip $env:VER" --notes-file notes.md --target $env:GITHUB_SHA --latest
          if ($LASTEXITCODE -ne 0) { throw "gh release create 실패 (rc=$LASTEXITCODE)" }
